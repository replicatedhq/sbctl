name: build-checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          only-new-issues: true
          args: --build-tags "netgo containers_image_ostree_stub exclude_graphdriver_devicemapper exclude_graphdriver_btrfs containers_image_openpgp"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make ginkgo test

  scan:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Grype vulnerability scanner in repo mode
        id: scan
        uses: anchore/scan-action@v7.4.2
        with:
          path: '.'
          grype-version: 'v0.118.0'
          only-fixed: true
          output-format: 'sarif'
          fail-build: true
          severity-cutoff: 'high'
      - name: Print Grype scan results
        if: ${{ !cancelled() }}
        run: |
          report=$(jq -r '
            .runs[0] as $run
            | (($run.tool.driver.rules // []) | map({key: .id, value: .}) | from_entries) as $rules
            | ($run.results // []) as $results
            | if ($results | length) == 0 then "No vulnerabilities found."
              else
                (["SEVERITY","PACKAGE","VERSION","VULNERABILITY","FIXED IN","LOCATION"] | @tsv),
                ($results[]
                  | (($rules[.ruleId].help.text) // "") as $h
                  | [ ($h | capture("Severity: (?<v>.*)").v // "-"),
                      ($h | capture("Package: (?<v>.*)").v // "-"),
                      ($h | capture("Version: (?<v>.*)").v // "-"),
                      ($h | capture("Vulnerability (?<v>.*)").v // "-"),
                      ($h | capture("Fix Version: (?<v>.*)").v // "-"),
                      (.locations[0].physicalLocation.artifactLocation.uri // "-") ]
                  | @tsv)
              end' "${{ steps.scan.outputs.sarif }}" | column -t -s "$(printf '\t')")
          echo "$report"
          { echo '### Grype scan results'; echo '```'; echo "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Grype scan results to GitHub Security tab
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

  # summary jobs, these jobs will only run if all the other jobs have succeeded
  validate-pr-checks:
    runs-on: ubuntu-latest
    needs:
      - lint
      - build
      - test
      - scan
    steps:
      - run: echo "All PR checks passed"

  # this job will validate that the validation did not fail and that all pr-checks succeed
  # it is used for the github branch protection rule
  validate-success:
    runs-on: ubuntu-latest
    needs:
      - validate-pr-checks
    if: always()
    steps:
      # https://docs.github.com/en/actions/learn-github-actions/contexts#needs-context
      # if the validate-pr-checks job was not successful, this job will fail
      - name: fail if validate-pr-checks job was not successful
        if: needs.validate-pr-checks.result != 'success'
        run: exit 1
      # if the validate-pr-checks job was successful, this job will succeed
      - name: succeed if validate-pr-checks job succeeded
        if: needs.validate-pr-checks.result == 'success'
        run: echo "Validation succeeded"
